# Run a different config with:
#     python -m examples.hancock_tabular_survival.pipeline --config my_config.yaml
#
# Paths are relative to the repository root, which is where the module form above
# is run from.

seed: 0

data:
  # `hancock` fetches the published clinical table into the shared cache.
  # Replace with a path to read a local extract instead.
  source: hancock
  identifier: patient_id

# Right-censored survival supervision. event_value is the value in `event` that
# means the event was observed, everything else recorded is treated as censored.
target:
  time: days_to_last_information
  event: survival_status
  event_value: deceased
  unit: days           # a display label; nothing is converted

# Column roles, and the transforms applied to each role IN ORDER. Nothing is imputed
# or scaled unless named here, so this block is the whole of the preprocessing. Add
# any sklearn transform to TRANSFORMS in config_handler.py to reference it by name.
features:
  continuous:
    columns:
      - age_at_initial_diagnosis
      - year_of_initial_diagnosis
    transform:
      - SimpleImputer: {strategy: median}
      - StandardScaler: {}

  categorical:
    columns:
      - sex
      - smoking_status
      - primarily_metastasis
    transform:
      - SimpleImputer: {strategy: most_frequent}
      - OrdinalEncoder: {handle_unknown: use_encoded_value, unknown_value: -1}

# The preprocessor is fitted on the training rows this split produces, then applied
# to the test rows unchanged.
split:
  # published -> the dataset's own train/test assignment, which is what keeps a
  # result comparable with other work on this cohort. random -> a fresh stratified
  # split, for a cohort that publishes none.
  mode: published
  file: dataset_split_in.json
  # Only read when mode is random.
  test_size: 0.2
  random_state: null    # null -> use `seed`
  stratify: event       # event | none | a column | [col, col]. Required, no default.

# TabICL row representations. The checkpoint is downloaded from Hugging Face on
# first use.
embedder:
  context_label: event  # which supervision value conditions the representation
  trainable: false      # required: fine-tuning on a few hundred patients can be destructive
  checkpoint: null      # null -> TabICL's own default checkpoint
  n_estimators: 1
  device: null          # null -> let TabICL choose
  random_state: null    # null -> use `seed`

# Demo only: the Cox head. Full batch, because the risk set covers every patient
# still being followed, not just those in a minibatch.
head:
  hidden_dim: 32
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  log_every: 50
