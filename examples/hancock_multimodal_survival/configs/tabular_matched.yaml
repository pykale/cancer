# Clinical table only, but scored on the patients that also have slides, so the
# number is directly comparable with the imaging and multimodal runs.
DATASET:
  MODALITIES: ["clinical"]
  REQUIRE_MODALITIES: ["imaging"]
  PATIENTS: 0
  NUM_WORKERS: 0
SOLVER:
  SEED: 2026
  BASE_LR: 0.0005
  MAX_EPOCHS: 60
  BATCH_SIZE: 64
  EARLY_STOP: 15
FUSION:
  FUSION_DIM: 64
OUTPUT:
  OUT_DIR: "outputs/hancock_multimodal_survival/tabular_matched"
