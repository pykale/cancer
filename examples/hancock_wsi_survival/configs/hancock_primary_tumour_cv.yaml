# Overall survival with 5-fold patient-level cross-validation.
# Folds are stratified on the event indicator; each writes its own fold_<i>/ directory.
DATASET:
  SOURCE: "hancock"
  PATIENTS: 0
  MAX_PATCHES: 2048
  NUM_WORKERS: 4
  NUM_FOLDS: 5
  VAL_RATIO: 0.15

MODEL:
  INPUT_DIM: 1024
  HIDDEN_DIM: 256
  ATTENTION_DIM: 128
  DROPOUT: 0.25

SOLVER:
  SEED: 2026
  BASE_LR: 0.0001
  MAX_EPOCHS: 30
  BATCH_SIZE: 16
  EARLY_STOP: 10

SURVIVAL:
  ENDPOINT: "OS"
  EVAL_TIMES: [365.0, 1095.0, 1825.0]

OUTPUT:
  OUT_DIR: "outputs/hancock_wsi_survival_cv"
