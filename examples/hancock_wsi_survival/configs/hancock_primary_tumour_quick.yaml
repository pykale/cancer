# Fast configuration for checking the pipeline end to end on real data.
# Heavily subsampled patches and few epochs: useful for validating wiring and
# outputs, not for reporting results.
DATASET:
  SOURCE: "hancock"
  # Bounds the download, not the cohort: the feature root is the cache directory,
  # so a cache already holding more patients contributes all of them. Give a run
  # its own CACHE_DIR to pin the cohort to exactly these patients.
  PATIENTS: 50
  MAX_PATCHES: 256
  NUM_WORKERS: 4
  VALIDATE_FEATURES: False

MODEL:
  INPUT_DIM: 1024
  HIDDEN_DIM: 128
  ATTENTION_DIM: 64
  DROPOUT: 0.25

SOLVER:
  SEED: 2026
  BASE_LR: 0.0003
  MAX_EPOCHS: 3
  BATCH_SIZE: 32
  EARLY_STOP: 0

SURVIVAL:
  ENDPOINT: "OS"
  EVAL_TIMES: [365.0, 1095.0, 1825.0]

OUTPUT:
  OUT_DIR: "outputs/hancock_wsi_survival_quick"
