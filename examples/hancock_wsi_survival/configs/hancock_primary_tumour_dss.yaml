# Disease-specific survival: only tumour-attributed deaths count as events.
# Patients recorded as "deceased" without a cause cannot be classified for this
# endpoint and are excluded; see clinical_exclusions in cohort_summary.json.
DATASET:
  SOURCE: "hancock"
  PATIENTS: 0
  MAX_PATCHES: 2048
  NUM_WORKERS: 4

MODEL:
  INPUT_DIM: 1024
  HIDDEN_DIM: 256
  ATTENTION_DIM: 128
  DROPOUT: 0.25

SOLVER:
  SEED: 2026
  BASE_LR: 0.0001
  MAX_EPOCHS: 30
  # The disease-specific event rate is lower than for overall survival, so batches
  # are enlarged to keep events in each Cox risk set.
  BATCH_SIZE: 32
  EARLY_STOP: 10

SURVIVAL:
  ENDPOINT: "DSS"
  EVAL_TIMES: [365.0, 1095.0, 1825.0]

OUTPUT:
  OUT_DIR: "outputs/hancock_wsi_survival_dss"
