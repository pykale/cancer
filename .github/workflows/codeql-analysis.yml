# Copied from PyKale (pykale/pykale), .github/workflows/codeql-analysis.yml, and updated:
# - github/codeql-action v2 is deprecated, so the actions are v4 and actions/checkout is v4.
# - Python needs no build, so build-mode is "none" instead of the Autobuild step.
# - It also runs for the migration/pykale-core integration branch, as ci.yml does.
# See https://github.com/github/codeql-action

name: codeql-analysis

on:
  push:
    branches: [main, migration/pykale-core]
  pull_request:
    branches: [main, migration/pykale-core]
  schedule:
    - cron: "15 18 * * 5" # every Friday at 18:15 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
