# Builds the wheel and source distribution and uploads them as the "dist" artifact.
#
# Called by release.yml and release-on-approval.yml. Trusted publishing to PyPI cannot run inside a reusable
# workflow, so this one only builds; each calling workflow publishes the artifact from a job of its own.
# https://github.com/pypa/gh-action-pypi-publish#trusted-publishing

name: build-dist

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Empty builds the commit of the calling event, e.g. the release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install pypa/build
        run: python -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: python -m build --sdist --wheel --outdir dist/ .
      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
