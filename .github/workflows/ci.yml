name: CI

on:
  # changelog.yml dispatches CI on the release pull request's changelog commit.
  workflow_dispatch:
  push:
    branches: [main, migration/pykale-core]
  pull_request:
    branches: [main, migration/pykale-core]

env:
  # The checkpoint test_tabicl.py needs
  TABICL_CHECKPOINT: tabicl-classifier-v2-20260212.ckpt

jobs:

  pre-commit-check:
    name: Pre-commit checks including linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: pytest (${{ matrix.installer }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # makes `uv sync` use the interpreter that setup-python provides
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        installer: [uv, pip] # test uv and pip
        include:
          # uv installs the exact versions in uv.lock into .venv, which is put on PATH for the later steps.
          # MOGONET also needs torch_scatter and torch_sparse built for the installed PyTorch, from the PyG wheel index.
          - installer: uv
            install: |
              uv sync --frozen --extra tabular --extra multiomics
              echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
              TORCH=$(.venv/bin/python -c "import torch; print(torch.__version__)")
              uv pip install --only-binary :all: torch_scatter torch_sparse --find-links "https://data.pyg.org/whl/torch-${TORCH}.html"

          # pip resolves from the bounds in pyproject.toml
          # The dev tools are a dependency group (PEP 735), which needs pip >= 25.1.
          - installer: pip
            install: |
              python -m pip install --upgrade pip
              python -m pip install -e ".[tabular,multiomics]" --group dev
              TORCH=$(python -c "import torch; print(torch.__version__)")
              python -m pip install --only-binary :all: torch_scatter torch_sparse -f "https://data.pyg.org/whl/torch-${TORCH}.html"
    steps:
      - uses: actions/checkout@v4

      # installs pip by default. Only the pip jobs cache pip's downloads: the uv jobs never create ~/.cache/pip,
      # and setup-python fails the job when that folder is missing at the end.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: ${{ matrix.installer == 'pip' && 'pip' || '' }}
          cache-dependency-path: pyproject.toml

      # install uv
      - uses: astral-sh/setup-uv@v5
        if: matrix.installer == 'uv'
        with:
          enable-cache: true

      - name: Install package, tabular and multiomics extras and dev tools (${{ matrix.installer }})
        run: ${{ matrix.install }}

      - name: Cache the TabICL checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.TABICL_CHECKPOINT }}

      - name: Download the TabICL checkpoint
        run: python -c "from huggingface_hub import hf_hub_download; hf_hub_download('jingang/TabICL', '$TABICL_CHECKPOINT')"

      - name: pytest
        run: pytest --cov=kalecancer --cov-report=term-missing --cov-report=xml -rs

      # As in PyKale. A failed upload, e.g. from a fork without the token, does not fail CI.
      - name: Report coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
