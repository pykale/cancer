# Publishes a release created by hand, pre-releases included, to PyPI.
# The published event also covers releases first saved as drafts in the GitHub UI.
# https://packaging.python.org/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# Copied from PyKale (pykale/pykale) and changed to trusted publishing: PyPI trusts this workflow file and its
# GitHub environment, configured on pypi.org, so no API token is stored. Approved release pull requests are published
# by release-on-approval.yml instead: a release created with a workflow's GITHUB_TOKEN does not trigger this one.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    uses: ./.github/workflows/build-dist.yml

  publish-pypi:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kalecancer
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
