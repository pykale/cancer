[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalecancer"
dynamic = ["version"]
description = "Multimodal cancer AI for the PyKale ecosystem — CT, whole-slide pathology, and clinical tabular data, with time-to-event prediction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PyKale" }]
keywords = ["pykale", "cancer", "multimodal", "survival", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "certifi>=2026.7.22",
    "h5py>=3.10",
    "huggingface-hub>=0.24",
    "jsonargparse[signatures]>=4.49",
    "lightning>=2.6,<2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pykale>=0.2.0",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "torch>=2.6",
    "torchsurv>=0.1.6",
]

[project.optional-dependencies]
tabular = [
    # The encoder calls private _train_forward methods; bump only with the parity test passing.
    "tabicl==2.1.1",
]
imaging = [
    "monai",
    "nibabel",
    "pydicom",
    "SimpleITK",
]
pathology = [
    "openslide-python",
    "tifffile",
]
interpret = [
    "shap",
    "captum",
    "umap-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "mypy",
    "build",
    "twine",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",

    # GPL-licensed, hence used only as a reference implementation in tests, never imported by the library.
    "scikit-survival>=0.25",
]

[project.urls]
Homepage = "https://github.com/pykale/cancer"
Repository = "https://github.com/pykale/cancer"
Issues = "https://github.com/pykale/cancer/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["kalecancer*"]
namespaces = false

# None of these file types are currently in use, but kept for future proofing
[tool.setuptools.package-data]
kalecancer = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
]

[tool.setuptools.dynamic]
version = { attr = "kalecancer.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "build",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "T20"   # flake8-print
]
ignore = [
    "B008",
    "E501"]

[tool.ruff.lint.isort]
known-first-party = ["kalecancer", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytorch_lightning".msg = "Use `import lightning.pytorch as L`."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
