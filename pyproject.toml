[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalecancer"
dynamic = ["version"]
description = "Multimodal cancer AI for the PyKale ecosystem — CT, whole-slide pathology, and clinical tabular data, with time-to-event prediction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PyKale" }]
keywords = ["pykale", "cancer", "multimodal", "survival", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "scikit-survival",
    "pyyaml",
    "certifi",
    "yacs",
    "h5py",
    "pykale",
    "pytorch-lightning",
]

[project.optional-dependencies]
tabular = [
    "tabicl>=2.1",
]
imaging = [
    "monai",
    "nibabel",
    "pydicom",
    "SimpleITK",
]
pathology = [
    "openslide-python",
    "tifffile",
]
interpret = [
    "shap",
    "captum",
    "umap-learn",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "mypy",
    "build",
    "twine",
    "lifelines",
]

[project.urls]
Homepage = "https://github.com/pykale/cancer"
Repository = "https://github.com/pykale/cancer"
Issues = "https://github.com/pykale/cancer/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["kalecancer*"]
namespaces = true

[tool.setuptools.package-data]
kalecancer = [
    "_version.txt",
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
]

[tool.setuptools.dynamic]
version = { file = "kalecancer/_version.txt" }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "build",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "T20"   # flake8-print
]
ignore = [
    "B008",
    "E501"]

[tool.ruff.lint.isort]
known-first-party = ["kalecancer", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
